services:
  ollama:
    image: ollama/ollama
    container_name: vox-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./.cache/ollama:/root/.ollama
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    environment:
      - OLLAMA_MODEL=gemma4:e4b
      # Set OLLAMA_VULKAN=0 to disable Vulkan
      # Set GGML_VK_VISIBLE_DEVICES=<ids> to select specific Vulkan devices
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-gemma4:e4b}; wait"

  vox-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vulkan-enabled whisper-cli binary (supports AMD, Intel, and NVIDIA via Vulkan)
        WHISPER_IMAGE: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    container_name: vox-server
    restart: always
    ports:
      - 8000:8000
    volumes:
      - ./.cache/whisper-models:/models
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - video
    depends_on:
      - ollama
    environment:
      - BACKEND_PORT=8000
      - FFMPEG_PATH=ffmpeg
      - WHISPER_MODEL=/models/ggml-small.en.bin
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma4:e4b
